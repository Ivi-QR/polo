<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Póló QR</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px;">
  <h1 id="szoveg">Töltés...</h1>
  <img id="kep" src="" alt="GIF" style="max-width: 90%;">

  <script>
    // Ez a kis kód automatikusan beolvassa a Decap CMS-ből elmentett adatokat
    fetch('/content.json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('szoveg').innerText = data.szoveg;
        document.getElementById('kep').src = data.kep;
      });
  </script>
</body>
</html>
