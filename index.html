<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Póló QR</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="google-fonts-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      margin: 0;
      /* Itt vettük sokkal kisebbre a fenti/alsó belső margót, hogy ne legyen üresen lent-fent */
      padding: 10px 15px; 
      text-align: center;
      transition: background-color 0.3s ease;
    }
  </style>
</head>
<body id="oldal-test">

  <div id="fokontener" style="max-width: 600px; width: 100%; margin: 0 auto; padding: 10px; box-sizing: border-box;">
    <div id="tartalom-tarolo">Töltés...</div>
  </div>

  <script>
    fetch('content.json')
      .then(response => response.json())
      .then(data => {
        const body = document.getElementById('oldal-test');
        if (data.hatterszin) body.style.backgroundColor = data.hatterszin;

        if (data.betutipus) {
          body.style.fontFamily = data.betutipus;
          const fontName = data.betutipus.split(',')[0].trim().replace(/['"]/g, '');
          if (!['sans-serif', 'serif', 'monospace', 'cursive', 'Courier New'].includes(fontName)) {
            const fontLink = `https://fonts.googleapis.com/css2?family=${fontName.replace(/ /g, '+')}:wght@400;600;700&display=swap`;
            document.getElementById('google-fonts-link').href = fontLink;
          }
        }

        const tarolo = document.getElementById('tartalom-tarolo');
        tarolo.innerHTML = '';

        if (data.elemek && Array.isArray(data.elemek)) {
          data.elemek.forEach(elem => {
            if (elem.type === 'szoveg_blokk') {
              const div = document.createElement('div');
              div.innerHTML = marked.parse(elem.tartalom || '');
              div.style.fontSize = (elem.meret ? elem.meret + 'px' : '16px');
              div.style.lineHeight = (elem.sorkoz ? elem.sorkoz : '1.5'); // Sorköz kezelése
              div.style.color = elem.szinszin || '#000000';
              div.style.textAlign = elem.igazitas || 'center';
              // Kisebb térköz az elemek között (10px helyett a korábbi 20px helyett)
              div.style.margin = '10px 0'; 
              tarolo.appendChild(div);
            }
            else if (elem.type === 'kep_blokk' && elem.kep) {
              const img = document.createElement('img');
              img.src = elem.kep;
              img.alt = elem.alt || '';
              img.style.width = '100%';
              img.style.maxWidth = '100%';
              img.style.borderRadius = '8px';
              img.style.margin = '10px 0'; // Kép alatti/feletti hely minimalizálása
              tarolo.appendChild(img);
            }
            else if (elem.type === 'video_blokk' && elem.url) {
              let embedUrl = elem.url;
              if (elem.url.includes('watch?v=')) {
                embedUrl = elem.url.replace('watch?v=', 'embed/');
              }
              const iframe = document.createElement('iframe');
              iframe.src = embedUrl;
              iframe.width = '560';
              iframe.height = '315';
              iframe.style.width = '100%';
              iframe.style.border = 'none';
              iframe.style.borderRadius = '8px';
              iframe.style.margin = '10px 0';
              tarolo.appendChild(iframe);
            }
            else if (elem.type === 'urom_blokk') {
              const spacer = document.createElement('div');
              spacer.style.height = (elem.meret ? elem.meret + 'px' : '15px');
              tarolo.appendChild(spacer);
            }
          });
        }
      });
  </script>
</body>
</html>
